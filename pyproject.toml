[project]
name = "gamejam4-teambamboo"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.4.0",
    "pygame-ce>=2.5.6",
    "pygame-gui>=0.6.14",
]

[project.optional-dependencies]
train = [
    "tensorboard>=2.18",
    "torch>=2.5",
]

[dependency-groups]
dev = [
    "matplotlib>=3.11.2",
    "pytest>=8",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
